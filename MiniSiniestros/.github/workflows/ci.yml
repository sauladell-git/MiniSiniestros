name: MiniSiniestros CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build & Test (.NET & xUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Dependencies
        run: dotnet restore MiniSiniestros.sln

      - name: Build Solution
        run: dotnet build MiniSiniestros.sln -c Release --no-restore

      - name: Run Unit Tests with Code Coverage
        run: dotnet test MiniSiniestros.sln -c Release --no-build --collect:"XPlat Code Coverage" --verbosity normal

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: '**/TestResults/**/coverage.cobertura.xml'

  docker-build:
    name: Validate Docker Containers
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Compose Images
        run: docker compose build
